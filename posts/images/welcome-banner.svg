<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" rx="16" fill="url(#grad1)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="640" y1="0" x2="640" y2="400" />
  </g>

  <!-- Glowing shapes -->
  <circle cx="680" cy="100" r="80" fill="#38bdf8" opacity="0.1" filter="blur(20px)" />
  <circle cx="120" cy="300" r="90" fill="#818cf8" opacity="0.08" filter="blur(30px)" />

  <!-- Content -->
  <rect x="70" y="80" width="46" height="46" rx="10" fill="url(#accentGrad)" />
  <path d="M85 103 L91 109 L101 97" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <text x="70" y="180" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800">
    Welcome to My Personal Site
  </text>
  
  <text x="70" y="220" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">
    Portfolio • CV • Projects • Markdown Blog
  </text>

  <!-- Code pill badge -->
  <rect x="70" y="270" width="180" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="95" y="293" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="600">
    github.io / posts
  </text>
</svg>
